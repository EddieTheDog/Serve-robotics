<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>The Eddie's 2025 — Self Check-In</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;700&display=swap');

* { box-sizing:border-box; margin:0; padding:0; user-select:none; touch-action:manipulation; }
body {
  font-family:'DM Sans','Helvetica Neue',sans-serif;
  margin:0; padding:0; min-height:100vh; width:100%;
  display:flex; flex-direction:column; justify-content:center; align-items:center;
  background:#f6f6f6; color:#111;
}
#main-container {
  width:100%; max-width:520px; padding:32px 24px;
  text-align:center; flex:1; position:relative;
  display:flex; flex-direction:column; justify-content:center;
}

/* TITLE */
.kiosk-title { margin-bottom:36px; }
.kiosk-title-main { font-family:'Bebas Neue',sans-serif; font-size:80px; letter-spacing:3px; line-height:0.85; color:#111; display:block; }
.kiosk-title-year { font-family:'Bebas Neue',sans-serif; font-size:28px; letter-spacing:10px; color:#c8c8c8; display:block; margin-top:8px; }
.kiosk-title-divider { width:40px; height:2px; background:#ddd; margin:14px auto 0; display:block; }
.kiosk-title-sub { font-size:10px; font-weight:700; letter-spacing:4px; text-transform:uppercase; color:#bbb; display:block; margin-top:12px; }

/* FAKE INPUTS */
.fake-input {
  font-size:20px; font-weight:500; padding:14px 16px; margin-bottom:12px; width:100%;
  border-radius:12px; border:2px solid #e4e4e4; background:#fff;
  text-align:left; height:52px; display:flex; align-items:center;
  overflow-x:auto; white-space:nowrap; color:#111; transition:border-color 0.15s, box-shadow 0.15s;
}
.fake-input.active { border-color:#111; box-shadow:0 0 0 3px rgba(0,0,0,0.06); }
.fake-input .cursor { width:2px; background:#111; animation:blink 1s step-start infinite; margin-left:2px; height:1.1em; flex-shrink:0; }
@keyframes blink { 0%,50%,100%{opacity:1} 25%,75%{opacity:0} }
.fake-input[data-placeholder]::before { content:attr(data-placeholder); color:#ccc; pointer-events:none; font-weight:400; }
.fake-input.has-content::before { display:none; }

/* GLOBAL BUTTONS */
button {
  display:block; font-size:15px; font-weight:700; padding:16px;
  margin-top:10px; width:100%; background:#111; color:#fff;
  border:none; border-radius:12px; cursor:pointer;
  text-transform:uppercase; letter-spacing:2px; font-family:inherit; transition:opacity 0.1s;
}
button:active { opacity:0.7; }

/* KEYBOARD */
#form-step-2, #waiting { display:none; }
#custom-keyboard { display:flex; flex-direction:column; position:fixed; bottom:0; left:0; right:0; background:#111; padding:6px; gap:5px; z-index:1000; }
.keyboard-row { display:flex; justify-content:center; gap:5px; }
.keyboard-row button { flex:1; font-size:20px; padding:14px 0; border-radius:10px; background:#2a2a2a; color:#fff; font-weight:700; margin:0; letter-spacing:0; width:auto; }
.keyboard-row button:active { background:#444; opacity:1; }

/* FULLSCREEN */
#fullscreen-btn { position:absolute; top:20px; right:20px; width:36px; height:36px; background:#111; color:#fff; border-radius:8px; display:flex; justify-content:center; align-items:center; font-weight:bold; cursor:pointer; z-index:2000; font-size:13px; padding:0; margin:0; letter-spacing:0; }

/* CAMERA */
#camera-container { width:100%; max-width:280px; height:280px; margin:0 auto 20px; border:3px solid #111; border-radius:16px; overflow:hidden; background:#000; position:relative; }
#video { width:100%; height:100%; object-fit:cover; }
#camera-msg { position:absolute; bottom:10px; left:0; right:0; color:#fff; background:rgba(0,0,0,0.65); padding:6px; font-size:13px; font-weight:600; letter-spacing:0.5px; }

/* WAITING SCREEN */
#waiting { width:100%; flex-direction:column; align-items:center; justify-content:center; min-height:60vh; }
.waiting-inner { display:flex; flex-direction:column; align-items:center; gap:40px; animation:fadeUp 0.5s ease both; }
@keyframes fadeUp { from{opacity:0;transform:translateY(14px)} to{opacity:1;transform:translateY(0)} }

.waiting-hero { text-align:center; }
.waiting-label { font-size:12px; font-weight:700; letter-spacing:3px; text-transform:uppercase; color:#bbb; display:block; margin-bottom:10px; }
.waiting-name { font-family:'Bebas Neue',sans-serif; font-size:42px; letter-spacing:2px; color:#111; display:block; line-height:1; }
.waiting-tagline { font-size:12px; font-weight:600; letter-spacing:2.5px; text-transform:uppercase; color:#bbb; display:block; margin-top:12px; min-height:16px; }

/* Steps */
.steps-track { display:flex; align-items:flex-start; width:300px; }
.step-node { display:flex; flex-direction:column; align-items:center; gap:8px; flex-shrink:0; }
.step-circle { width:44px; height:44px; border-radius:50%; border:2.5px solid #ddd; background:#fff; display:flex; align-items:center; justify-content:center; font-size:15px; font-weight:800; color:#ccc; transition:border-color 0.4s, background 0.4s, color 0.4s; }
.step-circle.done   { border-color:#111; background:#111; color:#fff; }
.step-circle.active { border-color:#111; color:#111; background:#fff; }
.step-label { font-size:10px; font-weight:700; letter-spacing:0.5px; text-transform:uppercase; color:#ccc; transition:color 0.4s; white-space:nowrap; }
.step-label.done, .step-label.active { color:#111; }

.step-line-wrap { flex:1; height:2.5px; position:relative; background:#e4e4e4; overflow:hidden; margin-top:21px; }
.step-line-fill { position:absolute; inset:0; background:#111; transform:scaleX(0); transform-origin:left; transition:transform 0.6s cubic-bezier(0.4,0,0.2,1); }
.step-line-fill.filled { transform:scaleX(1); }
.step-line-fill::after {
  content:''; position:absolute; top:0; bottom:0; left:-80px; width:80px;
  background:linear-gradient(90deg, transparent, rgba(255,255,255,0.9) 50%, transparent);
  animation-name:glint; animation-timing-function:ease-in-out; animation-play-state:paused;
}
.step-line-fill.filled::after { animation-play-state:running; }
#line1.loop-shimmer::after { animation-duration:1.8s; animation-iteration-count:infinite; animation-delay:0.5s; }
#line2.filled::after { animation-duration:0.75s; animation-iteration-count:1; }
@keyframes glint { 0%{left:-80px} 100%{left:110%} }

.waiting-status { font-size:11px; font-weight:700; letter-spacing:2.5px; text-transform:uppercase; color:#ccc; }

/* HIDDEN D BUTTON */
#dismiss-trigger {
  position:fixed; bottom:24px; left:50%; transform:translateX(-50%);
  width:32px; height:32px; border-radius:8px;
  background:#e4e4e4; color:#999; font-size:12px; font-weight:700; letter-spacing:1px;
  border:none; cursor:pointer; display:none; margin:0; padding:0; z-index:100;
  font-family:inherit;
}
#dismiss-trigger:active { background:#ccc; }

/* DOTS DRAWER */
#dots-drawer {
  position:fixed; bottom:68px; left:50%; transform:translateX(-50%);
  background:#fff; border:2px solid #111; border-radius:14px;
  display:flex; gap:14px; align-items:center; overflow:hidden;
  max-height:0; opacity:0; padding:0 20px;
  transition:max-height 0.3s ease, opacity 0.25s ease, padding 0.3s ease;
  z-index:99;
}
#dots-drawer.open { max-height:80px; opacity:1; padding:14px 20px; }
.dot-btn { width:42px; height:42px; border-radius:50%; background:#f4f4f4; border:2px solid #e4e4e4; cursor:pointer; margin:0; padding:0; display:block; transition:background 0.15s; }
.dot-btn:active { background:#111; border-color:#111; opacity:1; }
</style>
</head>
<body>
<div id="main-container">

  <div class="kiosk-title">
    <span class="kiosk-title-main">The Eddie's</span>
    <span class="kiosk-title-year">2025</span>
    <span class="kiosk-title-divider"></span>
    <span class="kiosk-title-sub">Self Check-In</span>
  </div>

  <div id="form-step-1">
    <div id="first" class="fake-input" data-placeholder="First Name"></div>
    <div id="last" class="fake-input" data-placeholder="Last Name"></div>
    <button id="next-btn">Next</button>
    <div id="custom-keyboard"></div>
    <div id="fullscreen-btn">C</div>
  </div>

  <div id="form-step-2">
    <div id="camera-container">
      <video id="video" playsinline></video>
      <div id="camera-msg">Scan your QR code</div>
    </div>
  </div>

  <div id="waiting">
    <div class="waiting-inner">
      <div class="waiting-hero">
        <span class="waiting-label"   id="waiting-label">Welcome,</span>
        <span class="waiting-name"    id="waiting-name">Welcome</span>
        <span class="waiting-tagline" id="waiting-tagline"></span>
      </div>
      <div class="steps-track">
        <div class="step-node">
          <div class="step-circle done" id="step1-circle">checkmark</div>
          <div class="step-label done"  id="step1-label">Checked In</div>
        </div>
        <div class="step-line-wrap"><div class="step-line-fill" id="line1"></div></div>
        <div class="step-node">
          <div class="step-circle" id="step2-circle">2</div>
          <div class="step-label"  id="step2-label">QR Scanned</div>
        </div>
        <div class="step-line-wrap"><div class="step-line-fill" id="line2"></div></div>
        <div class="step-node">
          <div class="step-circle" id="step3-circle">3</div>
          <div class="step-label"  id="step3-label">Name Tag Ready</div>
        </div>
      </div>
      <span class="waiting-status" id="waiting-status">Verifying your info</span>
    </div>
  </div>

</div>

<button id="dismiss-trigger" onclick="toggleDotsDrawer()">D</button>
<div id="dots-drawer">
  <button class="dot-btn" onclick="dotClick(0)"></button>
  <button class="dot-btn" onclick="dotClick(1)"></button>
  <button class="dot-btn" onclick="dotClick(2)"></button>
</div>

<script>
let guestId=null, pollTimer=null, dotStep=0, declineActive=false, scannedData="";
let activeBox=null;
const boxes=[document.getElementById("first"), document.getElementById("last")];
const keyboard=document.getElementById("custom-keyboard"), fsBtn=document.getElementById("fullscreen-btn");
const nextBtn=document.getElementById("next-btn");
const keyboardRows=[["q","w","e","r","t","y","u","i","o","p"],["a","s","d","f","g","h","j","k","l"],["z","x","c","v","b","n","m","DEL"," "]];

function setActiveBox(box){
  boxes.forEach(b=>{let c=b.querySelector(".cursor");if(c)c.remove();b.classList.remove("active");});
  activeBox=box; activeBox.classList.add("active");
  const cur=document.createElement("div"); cur.className="cursor"; activeBox.appendChild(cur);
  showKeyboard(activeBox);
}
function showKeyboard(box){
  keyboard.innerHTML="";
  keyboardRows.forEach(row=>{
    const div=document.createElement("div"); div.className="keyboard-row";
    row.forEach(key=>{
      const btn=document.createElement("button");
      btn.textContent=key===" "?"_":key.toUpperCase()==="DEL"?"DEL":key;
      btn.onclick=()=>insertKey(key); div.appendChild(btn);
    });
    keyboard.appendChild(div);
  });
  keyboard.style.display="flex";
}
function insertKey(key){
  if(!activeBox) return;
  let c=activeBox.textContent.replace(/\u200B/g,'');
  if(key==="DEL") c=c.slice(0,-1);
  else if(key===" ") c+=" ";
  else c+=key;
  activeBox.textContent=c;
  let cur=activeBox.querySelector(".cursor"); if(cur)cur.remove();
  const nc=document.createElement("div"); nc.className="cursor"; activeBox.appendChild(nc);
  activeBox.classList.toggle("has-content",c.length>0);
}
boxes.forEach(box=>box.addEventListener("click",()=>setActiveBox(box)));

fsBtn.addEventListener("click",()=>{
  const el=document.documentElement;
  if(el.requestFullscreen)el.requestFullscreen();
  else if(el.webkitRequestFullscreen)el.webkitRequestFullscreen();
  else if(el.msRequestFullscreen)el.msRequestFullscreen();
});
document.addEventListener("fullscreenchange",()=>{fsBtn.style.display=document.fullscreenElement?"none":"flex";});
document.addEventListener("webkitfullscreenchange",()=>{fsBtn.style.display=document.webkitFullscreenElement?"none":"flex";});
document.addEventListener("msfullscreenchange",()=>{fsBtn.style.display=document.msFullscreenElement?"none":"flex";});

let nextPressTimer=null;
nextBtn.addEventListener("mousedown",()=>{nextPressTimer=setTimeout(()=>fsBtn.click(),1000);});
nextBtn.addEventListener("mouseup",()=>clearTimeout(nextPressTimer));
nextBtn.addEventListener("mouseleave",()=>clearTimeout(nextPressTimer));
nextBtn.addEventListener("click",goToScan);

window.onload=()=>{
  setActiveBox(boxes[0]);
  document.getElementById("step1-circle").textContent="\u2713";
};

document.addEventListener("keydown",e=>e.preventDefault());
document.addEventListener("keypress",e=>e.preventDefault());
document.addEventListener("input",e=>e.preventDefault());

function goToScan(){
  if(!boxes[0].textContent.trim()||!boxes[1].textContent.trim()) return alert("Please enter both names");
  document.getElementById("form-step-1").style.display="none";
  document.getElementById("form-step-2").style.display="block";
  keyboard.style.display="none";
  startScanner();
}

function startScanner(){
  const video=document.getElementById("video"), msg=document.getElementById("camera-msg");
  navigator.mediaDevices.getUserMedia({video:{facingMode:"environment"}})
    .then(stream=>{video.srcObject=stream;video.play();requestAnimationFrame(tick);})
    .catch(err=>{msg.innerText="Camera access denied.";console.error(err);});
  function tick(){
    if(video.readyState===video.HAVE_ENOUGH_DATA){
      const ctx=document.createElement("canvas").getContext("2d");
      ctx.canvas.width=video.videoWidth;ctx.canvas.height=video.videoHeight;
      ctx.drawImage(video,0,0,ctx.canvas.width,ctx.canvas.height);
      const img=ctx.getImageData(0,0,ctx.canvas.width,ctx.canvas.height);
      const code=jsQR(img.data,img.width,img.height);
      if(code){
        scannedData=code.data;msg.innerText="QR Scanned!";msg.style.background="green";
        video.srcObject.getTracks().forEach(t=>t.stop());submitCheckin();return;
      }
    }
    requestAnimationFrame(tick);
  }
}

async function submitCheckin(){
  const res=await fetch("/api/checkin",{method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({firstName:boxes[0].textContent,lastName:boxes[1].textContent,qrData:scannedData})});
  const data=await res.json(); guestId=data.guestId;
  const firstName=boxes[0].textContent.trim();
  document.getElementById("form-step-2").style.display="none";
  document.getElementById("waiting").style.display="flex";
  document.getElementById("waiting-label").textContent="Welcome,";
  document.getElementById("waiting-name").textContent=firstName;
  document.getElementById("waiting-tagline").textContent="Please wait a moment";
  document.getElementById("waiting-status").textContent="Verifying your info";
  document.getElementById("dismiss-trigger").style.display="none";
  document.getElementById("dots-drawer").classList.remove("open");
  setStep(2);
  dotStep=0; declineActive=false;
  pollTimer=setInterval(pollStatus,2000);
}

async function pollStatus(){
  if(!guestId) return;
  const res=await fetch(`/api/guest/${guestId}`); const g=await res.json();
  switch(g.status){
    case "accepted":{
      setStep(3);
      document.getElementById("waiting-label").textContent="Your name tag is on its way,";
      document.getElementById("waiting-tagline").textContent="";
      document.getElementById("waiting-status").textContent="Almost ready";
      document.getElementById("dismiss-trigger").style.display="none";
      document.getElementById("dots-drawer").classList.remove("open");
      declineActive=false; break;
    }
    case "declined":{
      setStep(2);
      document.getElementById("waiting-label").textContent="Welcome,";
      document.getElementById("waiting-tagline").textContent="";
      document.getElementById("waiting-status").textContent="One more moment";
      document.getElementById("dismiss-trigger").style.display="flex";
      declineActive=true; dotStep=0; break;
    }
    case "completed": case "dismissed": resetKiosk(); break;
  }
}

function toggleDotsDrawer(){
  if(!declineActive) return;
  document.getElementById("dots-drawer").classList.toggle("open");
}
function dotClick(index){
  if(!declineActive) return;
  const seq=[1,0,2];
  if(index===seq[dotStep]){dotStep++;if(dotStep===3)awaitDismiss();}
  else dotStep=0;
}
function awaitDismiss(){
  fetch("/api/update",{method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({guestId,status:"dismissed"})}).then(()=>resetKiosk());
}

function setStep(n){
  const c1=document.getElementById("step1-circle"),c2=document.getElementById("step2-circle"),c3=document.getElementById("step3-circle");
  const l1=document.getElementById("step1-label"),l2=document.getElementById("step2-label"),l3=document.getElementById("step3-label");
  const line1=document.getElementById("line1"),line2=document.getElementById("line2");
  c1.className="step-circle done"; c1.textContent="\u2713"; l1.className="step-label done";
  if(n>=2){
    c2.className="step-circle done"; c2.textContent="\u2713"; l2.className="step-label done";
    line1.classList.remove("filled","loop-shimmer"); void line1.offsetWidth;
    line1.classList.add("filled","loop-shimmer");
  }
  if(n>=3){
    line1.classList.remove("loop-shimmer");
    c3.className="step-circle done"; c3.textContent="\u2713"; l3.className="step-label done";
    line2.classList.remove("filled"); void line2.offsetWidth;
    line2.classList.add("filled");
  } else {
    c3.className="step-circle"; c3.textContent="3"; l3.className="step-label";
    line2.classList.remove("filled");
  }
}

function resetSteps(){
  [["step1-circle","1"],["step2-circle","2"],["step3-circle","3"]].forEach(([id,t])=>{
    const el=document.getElementById(id); el.className="step-circle"; el.textContent=t;
  });
  ["step1-label","step2-label","step3-label"].forEach(id=>document.getElementById(id).className="step-label");
  document.getElementById("line1").classList.remove("filled","loop-shimmer");
  document.getElementById("line2").classList.remove("filled");
}

function resetKiosk(){
  clearInterval(pollTimer); pollTimer=null; guestId=null; scannedData=""; declineActive=false; dotStep=0;
  boxes.forEach(box=>{box.textContent="";box.classList.remove("has-content");});
  document.getElementById("waiting").style.display="none";
  document.getElementById("dismiss-trigger").style.display="none";
  document.getElementById("dots-drawer").classList.remove("open");
  resetSteps();
  document.getElementById("form-step-1").style.display="block";
  document.getElementById("form-step-2").style.display="none";
  document.getElementById("camera-msg").style.background="rgba(0,0,0,0.65)";
  document.getElementById("camera-msg").innerText="Scan your QR code";
  setActiveBox(boxes[0]);
}
</script>
</body>
</html>
