<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Pass Scanner — The Eddie's 2025</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
body { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; background: #000; color: #fff; min-height: 100vh; overflow: hidden; }

/* ── SETUP SCREEN ── */
#setup-screen {
  position: fixed; inset: 0; background: #f2f2f7; z-index: 200;
  display: flex; flex-direction: column;
  padding: calc(env(safe-area-inset-top,20px) + 0px) 0 calc(env(safe-area-inset-bottom,20px) + 0px);
}
#setup-screen.hidden { display: none; }

.setup-topbar {
  background: #000; color: #fff; padding: 14px 20px;
  padding-top: calc(env(safe-area-inset-top,20px) + 14px);
  flex-shrink: 0;
}
.setup-topbar-title { font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: 1.5px; color: #aaa; }
.setup-topbar-event { font-size: 18px; font-weight: 800; color: #fff; margin-top: 4px; }

.setup-body { flex: 1; overflow-y: auto; padding: 20px 16px 20px; }
.setup-label { font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; color: #888; margin: 0 0 10px 4px; }

/* Mode chips */
.mode-chips { display: flex; gap: 8px; margin-bottom: 20px; }
.mode-chip {
  flex: 1; padding: 14px 10px; background: #fff; border: 2px solid #e0e0e0;
  border-radius: 14px; text-align: center; cursor: pointer; transition: all 0.15s;
}
.mode-chip.sel { background: #000; border-color: #000; color: #fff; }
.mode-chip:active { opacity: 0.7; }
.mode-chip-icon { font-size: 24px; margin-bottom: 4px; }
.mode-chip-label { font-size: 13px; font-weight: 700; }
.mode-chip-sub { font-size: 11px; color: #aaa; margin-top: 2px; }
.mode-chip.sel .mode-chip-sub { color: rgba(255,255,255,0.6); }

/* Filter card */
.filter-card { background: #fff; border-radius: 16px; padding: 16px; margin-bottom: 12px; box-shadow: 0 1px 4px rgba(0,0,0,0.06); }
#filter-section { display: none; }
#filter-section.show { display: block; }
.filter-options { display: flex; flex-wrap: wrap; gap: 8px; }
.filter-chip {
  padding: 8px 14px; border-radius: 20px; border: 2px solid #e0e0e0;
  font-size: 13px; font-weight: 700; font-family: inherit;
  background: #f8f8f8; color: #999; cursor: pointer;
}
.filter-chip.sel { background: #000; color: #fff; border-color: #000; }
.filter-chip.eddie.sel  { background: #FFD700; color: #000; border-color: #FFD700; }
.filter-chip.actor.sel  { background: #ff6b00; color: #fff; border-color: #ff6b00; }
.filter-chip.vip.sel    { background: #9b59b6; color: #fff; border-color: #9b59b6; }
.filter-chip.staff.sel  { background: #2196F3; color: #fff; border-color: #2196F3; }
.filter-chip.custom.sel { background: #34c759; color: #fff; border-color: #34c759; }

.custom-pass-input {
  margin-top: 12px; display: none;
}
.custom-pass-input.show { display: block; }
.custom-pass-input input {
  width: 100%; padding: 12px 14px; font-size: 16px; font-family: inherit;
  border: 2px solid #e0e0e0; border-radius: 10px; outline: none;
}
.custom-pass-input input:focus { border-color: #000; }

.start-btn {
  width: 100%; padding: 17px; background: #000; color: #fff; border: none;
  border-radius: 14px; font-size: 17px; font-weight: 800; font-family: inherit;
  cursor: pointer; margin-top: 8px;
}
.start-btn:active { opacity: 0.8; }

/* ── SCAN SCREEN ── */
#scan-screen { position: fixed; inset: 0; background: #000; z-index: 100; display: none; }
#scan-screen.show { display: block; }

#video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }

/* Viewfinder */
.vf-wrap { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; pointer-events: none; }
.vf-frame { width: 260px; height: 260px; position: relative; }
.vf-frame::before, .vf-frame::after, .vf-inner::before, .vf-inner::after {
  content: ''; position: absolute; width: 36px; height: 36px; border-style: solid;
}
.vf-frame.normal::before, .vf-frame.normal::after, .vf-frame.normal + .vf-inner::before, .vf-frame.normal + .vf-inner::after { border-color: #fff; }
.vf-frame.filtered::before, .vf-frame.filtered::after, .vf-frame.filtered + .vf-inner::before, .vf-frame.filtered + .vf-inner::after { border-color: #34c759; }
.vf-frame::before  { top:0; left:0;   border-width:3px 0 0 3px; border-radius:4px 0 0 0; }
.vf-frame::after   { top:0; right:0;  border-width:3px 3px 0 0; border-radius:0 4px 0 0; }
.vf-inner::before  { bottom:0; left:0;  border-width:0 0 3px 3px; border-radius:0 0 0 4px; }
.vf-inner::after   { bottom:0; right:0; border-width:0 3px 3px 0; border-radius:0 0 4px 0; }

/* Scan topbar */
.scan-topbar {
  position: absolute; top:0; left:0; right:0; z-index:10;
  background: rgba(0,0,0,0.65); backdrop-filter: blur(16px);
  padding: 14px 20px;
  padding-top: calc(env(safe-area-inset-top,20px) + 14px);
  display: flex; align-items: center; justify-content: space-between;
}
.scan-topbar-left { flex: 1; }
.scan-mode-label { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 2px; color: rgba(255,255,255,0.5); }
.scan-filter-label { font-size: 15px; font-weight: 800; color: #fff; margin-top: 2px; }
.scan-back-btn {
  background: rgba(255,255,255,0.12); color: #fff; border: none;
  border-radius: 8px; padding: 8px 14px; font-size: 13px; font-weight: 700;
  font-family: inherit; cursor: pointer;
}

/* Filter badge on frame */
.filter-badge {
  position: absolute; bottom: calc(50% - 130px - 40px); left: 50%; transform: translateX(-50%);
  background: rgba(52,199,89,0.9); color: #fff; font-size: 12px; font-weight: 700;
  padding: 6px 16px; border-radius: 20px; text-transform: uppercase; letter-spacing: 1px;
  pointer-events: none;
}
.filter-badge.hidden { display: none; }

/* Reject flash */
#reject-flash {
  position: absolute; inset: 0; background: rgba(255,59,48,0.5);
  opacity: 0; pointer-events: none; transition: opacity 0.1s;
}
#reject-flash.show { opacity: 1; }

/* Accept flash */
#accept-flash {
  position: absolute; inset: 0; background: rgba(52,199,89,0.3);
  opacity: 0; pointer-events: none; transition: opacity 0.1s;
}
#accept-flash.show { opacity: 1; }

/* Status pill */
#scan-status {
  position: absolute; bottom: calc(env(safe-area-inset-bottom,20px) + 180px);
  left: 50%; transform: translateX(-50%);
  background: rgba(0,0,0,0.7); backdrop-filter: blur(10px);
  color: #fff; font-size: 14px; font-weight: 600;
  padding: 8px 20px; border-radius: 20px;
  white-space: nowrap; max-width: 90vw;
  transition: opacity 0.2s;
}

/* ── RESULT SHEET ── */
#result-sheet {
  position: absolute; bottom:0; left:0; right:0; z-index:20;
  background: #f2f2f7; border-radius: 24px 24px 0 0;
  padding: 20px 16px;
  padding-bottom: calc(env(safe-area-inset-bottom,20px) + 16px);
  transform: translateY(100%); transition: transform 0.32s cubic-bezier(0.32,0.72,0,1);
}
#result-sheet.show { transform: translateY(0); }
.sheet-handle { width: 36px; height: 4px; background: #ccc; border-radius: 2px; margin: 0 auto 20px; }
.result-header { display: flex; align-items: center; gap: 14px; margin-bottom: 14px; }
.result-avatar {
  width: 52px; height: 52px; border-radius: 14px; background: #000;
  display: flex; align-items: center; justify-content: center;
  font-size: 18px; font-weight: 800; color: #fff; flex-shrink: 0;
}
.result-name { font-size: 22px; font-weight: 800; color: #000; line-height: 1.1; }
.result-sub  { font-size: 14px; color: #888; margin-top: 2px; }
.pill-row { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
.pill {
  font-size: 12px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.5px;
  border-radius: 20px; padding: 5px 14px; background: #000; color: #fff;
}
.pill.eddie-plus { background: #FFD700; color: #000; }
.pill.vip        { background: #9b59b6; color: #fff; }
.pill.staff      { background: #2196F3; color: #fff; }
.pill.press      { background: #ff9500; color: #fff; }
.pill.actor      { background: #fff; color: #000; border: 1.5px solid #ddd; }

/* Pass result */
.pass-result {
  border-radius: 14px; padding: 16px 18px;
  display: flex; align-items: center; gap: 14px; margin-bottom: 12px;
  font-weight: 700;
}
.pass-result.valid   { background: #e8fff0; }
.pass-result.invalid { background: #fff0f0; }
.pass-result.na      { background: #f5f5f5; }
.pass-result-icon  { font-size: 26px; flex-shrink: 0; }
.pass-result-title { font-size: 16px; font-weight: 800; color: #000; }
.pass-result-sub   { font-size: 13px; margin-top: 2px; }
.pass-result.valid   .pass-result-sub { color: #34c759; }
.pass-result.invalid .pass-result-sub { color: #ff3b30; }
.pass-result.na      .pass-result-sub { color: #aaa; }

.all-passes-label { font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; color: #888; margin-bottom: 10px; }
.pass-card {
  background: #fff; border-radius: 14px; padding: 14px 16px;
  display: flex; align-items: center; gap: 12px; margin-bottom: 8px;
  box-shadow: 0 1px 4px rgba(0,0,0,0.06);
}
.pass-card-icon { font-size: 22px; flex-shrink: 0; }
.pass-card-name { font-size: 15px; font-weight: 700; color: #000; }
.pass-card-valid { font-size: 12px; color: #34c759; font-weight: 700; margin-top: 1px; }
.no-passes { background: #fff; border-radius: 14px; padding: 18px; text-align: center; color: #aaa; font-size: 15px; }

.scan-again-btn {
  width: 100%; padding: 16px; background: #000; color: #fff; border: none;
  border-radius: 14px; font-size: 17px; font-weight: 700; font-family: inherit; cursor: pointer; margin-top: 4px;
}
.scan-again-btn:active { opacity: 0.8; }
.assign-pass-btn {
  width: 100%; padding: 14px; background: #007aff; color: #fff; border: none;
  border-radius: 14px; font-size: 16px; font-weight: 700; font-family: inherit;
  cursor: pointer; margin-bottom: 8px;
}
</style>
</head>
<body>

<!-- ── SETUP SCREEN ── -->
<div id="setup-screen">
  <div class="setup-topbar">
    <div class="setup-topbar-title">The Eddie's 2025</div>
    <div class="setup-topbar-event">Pass Scanner</div>
  </div>
  <div class="setup-body">
    <div class="setup-label" style="margin-top:20px;">Scan Mode</div>
    <div class="mode-chips">
      <div class="mode-chip sel" id="chip-normal" onclick="selectMode('normal')">
        <div class="mode-chip-icon">🎫</div>
        <div class="mode-chip-label">Normal</div>
        <div class="mode-chip-sub">Show all passes</div>
      </div>
      <div class="mode-chip" id="chip-filtered" onclick="selectMode('filtered')">
        <div class="mode-chip-icon">🔍</div>
        <div class="mode-chip-label">Filter</div>
        <div class="mode-chip-sub">Check one pass type</div>
      </div>
    </div>

    <div id="filter-section">
      <div class="setup-label">Filter By Pass</div>
      <div class="filter-card">
        <div class="filter-options" id="filter-options">
          <button class="filter-chip" onclick="selectFilter('badge')">Event Badge</button>
          <button class="filter-chip actor" onclick="selectFilter('actor')">Actor Pass</button>
          <button class="filter-chip eddie" onclick="selectFilter('eddie')">Eddie+</button>
          <button class="filter-chip vip" onclick="selectFilter('vip')">VIP</button>
          <button class="filter-chip staff" onclick="selectFilter('staff')">Staff</button>
          <button class="filter-chip custom" onclick="selectFilter('custom')">Custom Pass...</button>
        </div>
        <div class="custom-pass-input" id="custom-pass-wrap">
          <input type="text" id="custom-pass-input" placeholder="e.g. Drink Pass" autocomplete="off">
        </div>
      </div>
    </div>

    <button class="start-btn" onclick="startScanning()">Start Scanning →</button>
  </div>
</div>

<!-- ── SCAN SCREEN ── -->
<div id="scan-screen">
  <video id="video" autoplay playsinline muted></video>

  <div class="scan-topbar">
    <div class="scan-topbar-left">
      <div class="scan-mode-label" id="scan-mode-label">Normal Mode</div>
      <div class="scan-filter-label" id="scan-filter-label">Showing all passes</div>
    </div>
    <button class="scan-back-btn" onclick="goBack()">⚙ Setup</button>
  </div>

  <div class="vf-wrap">
    <div class="vf-frame normal" id="vf-frame"><div class="vf-inner"></div></div>
  </div>
  <div class="filter-badge hidden" id="filter-badge"></div>

  <div id="scan-status">Point at a QR code</div>

  <div id="reject-flash"></div>
  <div id="accept-flash"></div>

  <!-- Result sheet -->
  <div id="result-sheet">
    <div class="sheet-handle"></div>
    <div class="result-header">
      <div class="result-avatar" id="result-avatar"></div>
      <div>
        <div class="result-name" id="result-name"></div>
        <div class="result-sub" id="result-sub"></div>
      </div>
    </div>
    <div class="pill-row" id="pill-row"></div>
    <div id="filter-result"></div>
    <div id="all-passes-wrap"></div>
    <button class="scan-again-btn" onclick="scanAgain()">Scan Another</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
<script>
// ── State ──
let scanMode = 'normal'; // 'normal' | 'filtered'
let filterType = null;   // 'badge' | 'actor' | 'eddie' | 'vip' | 'staff' | 'custom'
let customPassName = '';
let stream = null;
let scanning = false;
let animFrame = null;
let offscreenCanvas, offscreenCtx;
let _currentGuest = null;
let _passPresets = [];

async function loadPassPresets() {
  try { _passPresets = await (await fetch('/api/passes')).json(); } catch(e) { _passPresets = []; }
}

const PASS_EMOJIS = { drink:'🍹', bar:'🍹', photo:'📸', vip:'⭐', backstage:'🎭', meal:'🍽️', food:'🍽️', parking:'🅿️', actor:'🎬', badge:'🎫', event:'🎫' };
function passIcon(name) {
  const l = (name||'').toLowerCase();
  for (const [k,v] of Object.entries(PASS_EMOJIS)) if (l.includes(k)) return v;
  return '🎟️';
}
function pillClass(b) { return (b||'').toLowerCase().replace(/\s+/g,'-').replace(/[^a-z0-9-]/g,''); }

// ── Setup UI ──
function selectMode(m) {
  scanMode = m;
  document.getElementById('chip-normal').classList.toggle('sel', m === 'normal');
  document.getElementById('chip-filtered').classList.toggle('sel', m === 'filtered');
  document.getElementById('filter-section').classList.toggle('show', m === 'filtered');
}

function selectFilter(f) {
  filterType = f;
  document.querySelectorAll('.filter-chip').forEach(el => el.classList.remove('sel'));
  event.target.classList.add('sel');
  document.getElementById('custom-pass-wrap').classList.toggle('show', f === 'custom');
  if (f !== 'custom') document.getElementById('custom-pass-input').value = '';
}

function getFilterLabel() {
  if (scanMode === 'normal') return 'All Passes';
  if (!filterType) return '';
  const labels = { badge: 'Event Badge', actor: 'Actor Pass', eddie: 'Eddie+', vip: 'VIP', staff: 'Staff', custom: customPassName || 'Custom Pass' };
  return labels[filterType] || filterType;
}

function startScanning() {
  if (scanMode === 'filtered') {
    if (!filterType) { alert('Please choose a filter first'); return; }
    if (filterType === 'custom') {
      customPassName = document.getElementById('custom-pass-input').value.trim();
      if (!customPassName) { alert('Enter a pass name'); return; }
    }
  }
  document.getElementById('setup-screen').classList.add('hidden');
  document.getElementById('scan-screen').classList.add('show');

  // Update scan UI labels
  const label = getFilterLabel();
  document.getElementById('scan-mode-label').textContent = scanMode === 'filtered' ? 'Filter Mode' : 'Normal Mode';
  document.getElementById('scan-filter-label').textContent = scanMode === 'filtered' ? 'Checking: ' + label : 'Showing all passes';
  const badge = document.getElementById('filter-badge');
  const frame = document.getElementById('vf-frame');
  if (scanMode === 'filtered') {
    badge.textContent = label; badge.classList.remove('hidden');
    frame.className = 'vf-frame filtered';
  } else {
    badge.classList.add('hidden');
    frame.className = 'vf-frame normal';
  }

  initCamera();
}

function goBack() {
  stopCamera();
  document.getElementById('result-sheet').classList.remove('show');
  document.getElementById('scan-screen').classList.remove('show');
  document.getElementById('setup-screen').classList.remove('hidden');
}

// ── Camera ──
async function initCamera() {
  setScanStatus('Starting camera...');
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 }, height: { ideal: 720 } }
    });
    const video = document.getElementById('video');
    video.srcObject = stream;
    video.onloadedmetadata = () => {
      // Create persistent offscreen canvas
      offscreenCanvas = document.createElement('canvas');
      offscreenCanvas.width = video.videoWidth;
      offscreenCanvas.height = video.videoHeight;
      offscreenCtx = offscreenCanvas.getContext('2d');
      setScanStatus('Point at a QR code');
      scanning = true;
      scanLoop();
    };
  } catch(e) {
    setScanStatus('Camera unavailable — check permissions');
  }
}

function stopCamera() {
  scanning = false;
  if (animFrame) { cancelAnimationFrame(animFrame); animFrame = null; }
  if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
}

function scanLoop() {
  if (!scanning) return;
  const video = document.getElementById('video');
  if (video.readyState >= 2 && video.videoWidth > 0) {
    offscreenCtx.drawImage(video, 0, 0, offscreenCanvas.width, offscreenCanvas.height);
    const img = offscreenCtx.getImageData(0, 0, offscreenCanvas.width, offscreenCanvas.height);
    const code = jsQR(img.data, img.width, img.height, { inversionAttempts: 'dontInvert' });
    if (code) {
      scanning = false;
      handleCode(code.data);
      return;
    }
  }
  animFrame = requestAnimationFrame(scanLoop);
}

// ── Code Handling ──
// Parse any QR format → { token, passType, prefix }
// Formats: "EVT-<uuid>", "ACT-<uuid>", "DRI-<uuid>", or legacy URL
function parseQR(raw) {
  if (!raw) return null;
  const s = raw.trim();

  // Check for PREFIX- format: exactly 3 A-Z letters then a hyphen
  if (/^[A-Z]{3}-/.test(s)) {
    const prefix = s.slice(0, 3);
    const token  = s.slice(4); // everything after "XXX-"
    if (!token) return null;
    const typeMap = { EVT: 'badge', ACT: 'actor' };
    return { token, passType: typeMap[prefix] || 'custom', prefix };
  }

  // Legacy URL format (e.g. https://site.com/app?token=uuid)
  try {
    const t = new URL(s).searchParams.get('token');
    if (t) return { token: t, passType: 'badge', prefix: 'EVT' };
  } catch(e) {}

  // Bare UUID fallback (just in case)
  if (/^[0-9a-f-]{32,}$/i.test(s)) {
    return { token: s, passType: 'badge', prefix: 'EVT' };
  }

  return null;
}

async function handleCode(raw) {
  setScanStatus('Looking up...');
  const parsed = parseQR(raw);
  if (!parsed || !parsed.token) {
    flash('reject'); setScanStatus('Not a guest QR code');
    setTimeout(() => { scanning = true; scanLoop(); setScanStatus('Point at a QR code'); }, 2000);
    return;
  }
  try {
    const res = await fetch('/api/app-user?token=' + encodeURIComponent(parsed.token));
    if (!res.ok) throw new Error();
    const g = await res.json();
    showResult(g, parsed);
  } catch(e) {
    flash('reject'); setScanStatus('Guest not found');
    setTimeout(() => { scanning = true; scanLoop(); setScanStatus('Point at a QR code'); }, 2000);
  }
}

// ── Check filter pass ──
function checkFilter(g, parsed) {
  if (scanMode === 'normal') return null;
  let passes = [];
  try { passes = g.passes ? JSON.parse(g.passes) : []; } catch(e) {}

  // In filter mode, also check the QR was the right pass type
  // e.g. if checking Actor Pass but they showed their Event Badge QR → reject
  const scannedType = parsed ? parsed.passType : 'badge';

  if (filterType === 'badge') {
    if (scannedType !== 'badge') return { valid: false, label: 'Event Badge', note: 'Wrong pass shown — needs Event Pass QR', icon: '🎫' };
    return { valid: true, label: 'Event Badge', note: g.badge || 'General Admission', icon: '🎫' };
  }
  if (filterType === 'actor') {
    if (scannedType !== 'actor' && scannedType !== 'badge') return { valid: false, label: 'Actor Pass', note: 'Wrong pass type scanned', icon: '🎬' };
    return g.is_actor
      ? { valid: true,  label: 'Actor Pass', note: 'Verified actor', icon: '🎬' }
      : { valid: false, label: 'Actor Pass', note: 'Not an actor', icon: '🎬' };
  }
  if (filterType === 'eddie') {
    return g.badge === 'Eddie +'
      ? { valid: true,  label: 'Eddie+', note: 'Confirmed Eddie+', icon: '⭐' }
      : { valid: false, label: 'Eddie+', note: 'Does not have Eddie+', icon: '⭐' };
  }
  if (filterType === 'vip') {
    return g.badge === 'VIP'
      ? { valid: true,  label: 'VIP', note: 'Confirmed VIP', icon: '💜' }
      : { valid: false, label: 'VIP', note: 'Not a VIP', icon: '💜' };
  }
  if (filterType === 'staff') {
    return g.badge === 'Staff'
      ? { valid: true,  label: 'Staff', note: 'Confirmed Staff', icon: '🔵' }
      : { valid: false, label: 'Staff', note: 'Not staff', icon: '🔵' };
  }
  if (filterType === 'custom') {
    // For custom passes, check both the pass list AND that the QR prefix matches
    const passMatch = passes.find(p => p.toLowerCase().includes(customPassName.toLowerCase()));
    if (scannedType === 'custom' && parsed) {
      // Verify the prefix loosely matches the expected pass
      const expectedPrefix = customPassName.replace(/\s+/g,'').slice(0,3).toUpperCase();
      if (parsed.prefix && parsed.prefix !== expectedPrefix && parsed.prefix !== 'EVT') {
        return { valid: false, label: customPassName, note: 'Wrong pass shown', icon: passIcon(customPassName) };
      }
    }
    return passMatch
      ? { valid: true,  label: customPassName, note: '✓ ' + passMatch, icon: passIcon(customPassName) }
      : { valid: false, label: customPassName, note: 'Does not have this pass', icon: passIcon(customPassName) };
  }
  return null;
}

// ── Show Result ──
function showResult(g, parsed) {
  _currentGuest = g;
  const filterResult = checkFilter(g, parsed);
  const isValid = filterResult ? filterResult.valid : true;
  flash(isValid ? 'accept' : 'reject');

  const initials = ((g.first_name||'')[0]||'') + ((g.last_name||'')[0]||'');
  document.getElementById('result-avatar').textContent = initials;
  document.getElementById('result-name').textContent = g.first_name + ' ' + g.last_name;
  document.getElementById('result-sub').textContent = g.seat ? '📍 ' + g.seat : g.badge || 'No badge';

  const pills = [];
  if (g.badge) pills.push(`<span class="pill ${pillClass(g.badge)}">${g.badge}</span>`);
  if (g.is_actor) pills.push('<span class="pill actor">Actor</span>');
  document.getElementById('pill-row').innerHTML = pills.join('');

  // Filter result block
  const fr = document.getElementById('filter-result');
  if (filterResult) {
    const cls = filterResult.valid ? 'valid' : 'invalid';
    fr.innerHTML = `<div class="pass-result ${cls}">
      <div class="pass-result-icon">${filterResult.icon}</div>
      <div>
        <div class="pass-result-title">${filterResult.label}</div>
        <div class="pass-result-sub">${filterResult.valid ? '✓ ' : '✗ '}${filterResult.note}</div>
      </div>
    </div>`;
  } else {
    fr.innerHTML = '';
  }

  // All passes
  let passes = [];
  try { passes = g.passes ? JSON.parse(g.passes) : []; } catch(e) {}
  const pw = document.getElementById('all-passes-wrap');
  const showAll = scanMode === 'normal';
  if (showAll) {
    pw.innerHTML = '<div class="all-passes-label">All Passes</div>' + (passes.length
      ? passes.map(p => `<div class="pass-card"><div class="pass-card-icon">${passIcon(p)}</div><div><div class="pass-card-name">${p}</div><div class="pass-card-valid">✓ Valid</div></div></div>`).join('')
      : '<div class="no-passes">No extra passes</div>');
  } else {
    pw.innerHTML = '';
  }

  setScanStatus(isValid ? '✓ ' + (filterResult ? filterResult.label : 'Guest found') : '✗ Pass not valid');
  // Assign pass UI — show when in filtered custom mode and pass is missing, or always in normal mode
  const assignWrap = document.getElementById('assign-pass-wrap');
  const assignSel = document.getElementById('assign-pass-select');
  document.getElementById('assign-pass-status').textContent = '';
  if (_passPresets.length) {
    const showAssign = scanMode === 'normal' || (scanMode === 'filtered' && filterResult && !filterResult.valid);
    assignWrap.style.display = showAssign ? 'block' : 'none';
    assignSel.innerHTML = '<option value="">Select pass to assign...</option>' +
      _passPresets.map(p => `<option value="${p.name}">${p.emoji} ${p.name}</option>`).join('');
    // Pre-select the filtered pass if it was missing
    if (scanMode === 'filtered' && filterType === 'custom' && customPassName) {
      const opt = [...assignSel.options].find(o => o.value === customPassName);
      if (opt) opt.selected = true;
    }
  } else {
    assignWrap.style.display = 'none';
  }

  document.getElementById('result-sheet').classList.add('show');
}

async function doAssignPass() {
  if (!_currentGuest) return;
  const passName = document.getElementById('assign-pass-select').value;
  if (!passName) return;
  const statusEl = document.getElementById('assign-pass-status');
  statusEl.textContent = 'Assigning...';
  statusEl.style.color = '#aaa';
  try {
    const res = await fetch('/api/passes', {method:'PATCH', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ presetName: passName, guestId: _currentGuest.id })});
    const data = await res.json();
    if (data.success) {
      statusEl.textContent = `✓ "${passName}" assigned`;
      statusEl.style.color = '#34c759';
      // Update local guest data
      let passes = [];
      try { passes = _currentGuest.passes ? JSON.parse(_currentGuest.passes) : []; } catch(e) {}
      if (!passes.includes(passName)) passes.push(passName);
      _currentGuest.passes = JSON.stringify(passes);
    }
  } catch(e) {
    statusEl.textContent = 'Failed — check connection';
    statusEl.style.color = '#ff3b30';
  }
}

function scanAgain() {
  document.getElementById('result-sheet').classList.remove('show');
  setScanStatus('Point at a QR code');
  scanning = true;
  scanLoop();
}

// ── Utils ──
function setScanStatus(msg) { document.getElementById('scan-status').textContent = msg; }
function flash(type) {
  const el = document.getElementById(type === 'reject' ? 'reject-flash' : 'accept-flash');
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 300);
}

// Load pass presets on page load so assign dropdown is ready
loadPassPresets();
</script>
</body>
