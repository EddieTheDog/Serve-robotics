<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Photo Booth — The Eddie's 2025</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
<style>
* { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
body { font-family:'Helvetica Neue',Helvetica,Arial,sans-serif; background:#000; color:#fff; min-height:100vh; overflow:hidden; }

/* ── SETUP ── */
#setup-screen {
  position:fixed; inset:0; background:#f2f2f7; z-index:200;
  display:flex; flex-direction:column;
  padding-top:env(safe-area-inset-top,20px);
}
#setup-screen.hidden { display:none; }
.setup-topbar { background:#000; color:#fff; padding:14px 20px; padding-top:calc(env(safe-area-inset-top,20px) + 14px); flex-shrink:0; }
.setup-topbar-title { font-size:13px; font-weight:700; text-transform:uppercase; letter-spacing:1.5px; color:#aaa; }
.setup-topbar-event { font-size:18px; font-weight:800; color:#fff; margin-top:4px; }
.setup-body { flex:1; overflow-y:auto; padding:20px 16px 40px; }
.setup-label { font-size:13px; font-weight:700; text-transform:uppercase; letter-spacing:1px; color:#888; margin:0 0 10px 4px; }
.setup-card { background:#fff; border-radius:16px; padding:16px; margin-bottom:16px; box-shadow:0 1px 4px rgba(0,0,0,0.06); }

/* Overlay picker */
.overlay-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
.overlay-thumb {
  aspect-ratio:1; border-radius:10px; background:#f0f0f0;
  display:flex; align-items:center; justify-content:center;
  font-size:11px; color:#999; text-align:center; font-weight:600;
  cursor:pointer; border:2.5px solid transparent; overflow:hidden;
  transition:border-color 0.15s;
}
.overlay-thumb img { width:100%; height:100%; object-fit:contain; }
.overlay-thumb.sel { border-color:#007aff; }
.overlay-thumb.none-opt { font-size:24px; color:#ccc; }
.overlay-thumb.none-opt.sel { border-color:#007aff; }

/* Countdown style */
.style-chips { display:flex; gap:8px; flex-wrap:wrap; }
.style-chip {
  padding:8px 16px; border-radius:20px; border:2px solid #e0e0e0;
  font-size:13px; font-weight:700; background:#f8f8f8; color:#999; cursor:pointer;
  font-family:inherit;
}
.style-chip.sel { background:#000; color:#fff; border-color:#000; }

.start-btn { width:100%; padding:17px; background:#000; color:#fff; border:none; border-radius:14px; font-size:17px; font-weight:800; font-family:inherit; cursor:pointer; margin-top:4px; }
.start-btn:active { opacity:0.8; }

/* ── BOOTH SCREEN ── */
#booth-screen { position:fixed; inset:0; background:#000; display:none; flex-direction:column; }
#booth-screen.show { display:flex; }

/* Camera area — takes most of screen */
#camera-area { position:relative; flex:1; overflow:hidden; }
#video { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; transform:scaleX(-1); }
#photo-canvas { position:absolute; inset:0; width:100%; height:100%; display:none; }

/* Overlay preview on camera */
#overlay-preview-img {
  position:absolute; inset:0; width:100%; height:100%;
  object-fit:contain; pointer-events:none; z-index:5;
  display:none;
}

/* Countdown */
#countdown-display {
  position:absolute; inset:0; display:none;
  align-items:center; justify-content:center;
  z-index:10; pointer-events:none;
}
#countdown-display.show { display:flex; }
.countdown-number {
  font-size:200px; font-weight:800; line-height:1;
  color:#fff; text-shadow:0 4px 32px rgba(0,0,0,0.5);
  animation:countPop 0.4s cubic-bezier(0.34,1.56,0.64,1) both;
}
@keyframes countPop { from{opacity:0;transform:scale(0.5)} to{opacity:1;transform:scale(1)} }
.countdown-go {
  font-size:80px; font-weight:800; color:#34c759;
  text-shadow:0 4px 32px rgba(0,0,0,0.5);
  animation:countPop 0.3s ease both;
}

/* Flash */
#flash-el {
  position:absolute; inset:0; background:#fff;
  opacity:0; z-index:20; pointer-events:none;
  transition:opacity 0.05s;
}
#flash-el.flash { opacity:1; }

/* Top bar */
.booth-topbar {
  position:absolute; top:0; left:0; right:0; z-index:15;
  background:linear-gradient(to bottom, rgba(0,0,0,0.7), transparent);
  padding:14px 20px; padding-top:calc(env(safe-area-inset-top,20px) + 14px);
  display:flex; align-items:center; justify-content:space-between;
}
.booth-title { font-size:15px; font-weight:800; color:#fff; }
.booth-back-btn { background:rgba(255,255,255,0.15); color:#fff; border:none; border-radius:8px; padding:8px 14px; font-size:13px; font-weight:700; font-family:inherit; cursor:pointer; }

/* Bottom bar */
#bottom-bar {
  flex-shrink:0; background:rgba(0,0,0,0.85); backdrop-filter:blur(20px);
  padding:16px 20px; padding-bottom:calc(env(safe-area-inset-bottom,20px) + 16px);
}
.bottom-state { display:none; }
.bottom-state.active { display:block; }

/* Ready state */
.guests-row { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:14px; min-height:36px; align-items:center; }
.guest-chip {
  display:flex; align-items:center; gap:6px;
  background:rgba(255,255,255,0.12); border-radius:20px; padding:5px 10px 5px 6px;
}
.guest-chip-avatar { width:24px; height:24px; border-radius:50%; background:#444; display:flex; align-items:center; justify-content:center; font-size:10px; font-weight:800; color:#fff; flex-shrink:0; }
.guest-chip-name { font-size:12px; font-weight:700; color:#fff; }
.guest-chip-remove { background:none; border:none; color:rgba(255,255,255,0.4); font-size:14px; cursor:pointer; padding:0 0 0 2px; line-height:1; width:auto; margin:0; }
.no-guests-label { font-size:14px; color:rgba(255,255,255,0.3); }
.ready-actions { display:flex; gap:10px; }
.scan-guest-btn { flex:1; padding:14px; background:rgba(255,255,255,0.1); color:#fff; border:none; border-radius:12px; font-size:14px; font-weight:700; font-family:inherit; cursor:pointer; }
.take-photo-btn { flex:1; padding:14px; background:#fff; color:#000; border:none; border-radius:12px; font-size:14px; font-weight:800; font-family:inherit; cursor:pointer; }
.take-photo-btn:disabled { opacity:0.4; }

/* QR scan state (for adding guests) */
.qr-instruction { font-size:15px; font-weight:700; color:#fff; text-align:center; margin-bottom:14px; }
.qr-instruction span { color:rgba(255,255,255,0.4); font-weight:400; display:block; font-size:13px; margin-top:4px; }
.qr-cancel-btn { width:100%; padding:14px; background:rgba(255,255,255,0.1); color:#fff; border:none; border-radius:12px; font-size:15px; font-weight:700; font-family:inherit; cursor:pointer; }

/* Review state */
.review-preview { width:100%; aspect-ratio:4/3; border-radius:12px; overflow:hidden; margin-bottom:12px; background:#111; }
.review-preview img { width:100%; height:100%; object-fit:cover; }
.review-name { font-size:13px; font-weight:700; color:rgba(255,255,255,0.5); text-align:center; margin-bottom:12px; }
.review-actions { display:flex; gap:10px; }
.retake-btn { flex:1; padding:14px; background:rgba(255,255,255,0.1); color:#fff; border:none; border-radius:12px; font-size:15px; font-weight:700; font-family:inherit; cursor:pointer; }
.send-btn { flex:2; padding:14px; background:#34c759; color:#fff; border:none; border-radius:12px; font-size:15px; font-weight:800; font-family:inherit; cursor:pointer; }
.send-btn:disabled { opacity:0.5; }

/* QR viewfinder overlay */
#qr-vf {
  position:absolute; inset:0; display:none; align-items:center; justify-content:center; pointer-events:none; z-index:8;
}
#qr-vf.show { display:flex; }
.vf-frame { width:200px; height:200px; position:relative; }
.vf-frame::before,.vf-frame::after,.vf-inner::before,.vf-inner::after { content:''; position:absolute; width:26px; height:26px; border-style:solid; border-color:#fff; }
.vf-frame::before  { top:0; left:0;   border-width:3px 0 0 3px; border-radius:3px 0 0 0; }
.vf-frame::after   { top:0; right:0;  border-width:3px 3px 0 0; border-radius:0 3px 0 0; }
.vf-inner::before  { bottom:0; left:0;  border-width:0 0 3px 3px; border-radius:0 0 0 3px; }
.vf-inner::after   { bottom:0; right:0; border-width:0 3px 3px 0; border-radius:0 0 3px 0; }

#accept-flash { position:absolute; inset:0; background:rgba(52,199,89,0.3); opacity:0; pointer-events:none; transition:opacity 0.1s; z-index:9; }
#accept-flash.show { opacity:1; }
#reject-flash { position:absolute; inset:0; background:rgba(255,59,48,0.5); opacity:0; pointer-events:none; transition:opacity 0.1s; z-index:9; }
#reject-flash.show { opacity:1; }
</style>
</head>
<body>

<!-- ── SETUP ── -->
<div id="setup-screen">
  <div class="setup-topbar">
    <div class="setup-topbar-title">The Eddie's 2025</div>
    <div class="setup-topbar-event">Photo Booth</div>
  </div>
  <div class="setup-body">

    <div class="setup-label" style="margin-top:8px;">Overlay</div>
    <div class="setup-card">
      <div class="overlay-grid" id="overlay-grid">
        <div class="overlay-thumb none-opt sel" data-id="" onclick="selectOverlay('',this)">
          <span>No overlay</span>
        </div>
      </div>
    </div>

    <div class="setup-label">Countdown</div>
    <div class="setup-card">
      <div class="style-chips">
        <button class="style-chip sel" data-secs="3" onclick="selectCountdown(3,this)">3 sec</button>
        <button class="style-chip" data-secs="5" onclick="selectCountdown(5,this)">5 sec</button>
        <button class="style-chip" data-secs="10" onclick="selectCountdown(10,this)">10 sec</button>
      </div>
    </div>

    <button class="start-btn" onclick="startBooth()">Open Photo Booth →</button>
  </div>
</div>

<!-- ── BOOTH ── -->
<div id="booth-screen">
  <div id="camera-area">
    <video id="video" autoplay playsinline muted></video>
    <canvas id="photo-canvas"></canvas>
    <img id="overlay-preview-img" src="" alt="">
    <div id="countdown-display"></div>
    <div id="flash-el"></div>
    <div id="qr-vf"><div class="vf-frame"><div class="vf-inner"></div></div></div>
    <div id="accept-flash"></div>
    <div id="reject-flash"></div>
    <div class="booth-topbar">
      <div class="booth-title" id="booth-title">Photo Booth</div>
      <button class="booth-back-btn" onclick="goBack()">⚙ Setup</button>
    </div>
  </div>

  <div id="bottom-bar">

    <!-- READY: guests listed, take photo or scan more -->
    <div class="bottom-state active" id="state-ready">
      <div class="guests-row" id="guests-row">
        <span class="no-guests-label">Scan guests to include in this photo</span>
      </div>
      <div class="ready-actions">
        <button class="scan-guest-btn" onclick="startGuestScan()">+ Scan Guest</button>
        <button class="take-photo-btn" id="take-photo-btn" onclick="startCountdown()" disabled>Take Photo</button>
      </div>
    </div>

    <!-- QR scanning for guest -->
    <div class="bottom-state" id="state-qrscan">
      <div class="qr-instruction">
        Scan a guest QR code
        <span>They'll receive this photo in their app</span>
      </div>
      <button class="qr-cancel-btn" onclick="cancelGuestScan()">Done scanning</button>
    </div>

    <!-- REVIEW: show captured photo, send or retake -->
    <div class="bottom-state" id="state-review">
      <div class="review-preview"><img id="review-img" src="" alt=""></div>
      <div class="review-name" id="review-names"></div>
      <div class="review-actions">
        <button class="retake-btn" onclick="retake()">↩ Retake</button>
        <button class="send-btn" id="send-btn" onclick="sendPhotos()">Send to Guests ✓</button>
      </div>
    </div>

  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
<script>
'use strict';

let _overlays = [];
let _selectedOverlayId = '';
let _selectedOverlayDataUrl = null;
let _countdownSecs = 3;
let _guests = [];        // guests added to current shot
let _capturedDataUrl = null;
let _stream = null;
let _qrScanning = false;
let _qrAnimFrame = null;
let _offCanvas = null;
let _offCtx = null;
let _stage = 'ready';

// ── SETUP ─────────────────────────────────────────────────────────────────────
async function loadOverlays() {
  try {
    _overlays = await (await fetch('/api/overlays')).json();
  } catch(e) { _overlays = []; }
  renderOverlayGrid();
}

function renderOverlayGrid() {
  const grid = document.getElementById('overlay-grid');
  const noneHtml = `<div class="overlay-thumb none-opt${_selectedOverlayId===''?' sel':''}" data-id="" onclick="selectOverlay('',this)"><span>No overlay</span></div>`;
  grid.innerHTML = noneHtml + _overlays.map(o =>
    `<div class="overlay-thumb${_selectedOverlayId===o.id?' sel':''}" data-id="${o.id}" onclick="selectOverlay('${o.id}',this)">
      <img src="/api/overlays?id=${o.id}" onerror="this.style.display='none'">
      <div style="font-size:10px;text-align:center;padding:2px;">${o.name}</div>
    </div>`
  ).join('');
}

function selectOverlay(id, el) {
  _selectedOverlayId = id;
  document.querySelectorAll('.overlay-thumb').forEach(t => t.classList.remove('sel'));
  el.classList.add('sel');
  if (id) {
    const o = _overlays.find(x => x.id === id);
    // We'll fetch image data when needed
  } else {
    _selectedOverlayDataUrl = null;
  }
}

function selectCountdown(secs, el) {
  _countdownSecs = secs;
  document.querySelectorAll('.style-chip').forEach(c => c.classList.remove('sel'));
  el.classList.add('sel');
}

// ── BOOTH START ───────────────────────────────────────────────────────────────
async function startBooth() {
  document.getElementById('setup-screen').classList.add('hidden');
  document.getElementById('booth-screen').classList.add('show');
  await initCamera();

  // Load overlay image data if selected
  if (_selectedOverlayId) {
    try {
      const o = _overlays.find(x => x.id === _selectedOverlayId);
      if (o) {
        const res = await fetch('/api/overlays?id=' + _selectedOverlayId);
        const data = await res.json();
        _selectedOverlayDataUrl = data.image_data || null;
        if (_selectedOverlayDataUrl) {
          const img = document.getElementById('overlay-preview-img');
          img.src = _selectedOverlayDataUrl;
          img.style.display = 'block';
        }
      }
    } catch(e) {}
  }

  setStage('ready');
}

function goBack() {
  stopQR();
  if (_stream) { _stream.getTracks().forEach(t => t.stop()); _stream = null; }
  document.getElementById('booth-screen').classList.remove('show');
  document.getElementById('setup-screen').classList.remove('hidden');
  _guests = []; _capturedDataUrl = null;
}

// ── CAMERA ────────────────────────────────────────────────────────────────────
async function initCamera() {
  try {
    _stream = await navigator.mediaDevices.getUserMedia({
      video:{ facingMode:{ideal:'environment'}, width:{ideal:1920}, height:{ideal:1080} }
    });
    const video = document.getElementById('video');
    video.srcObject = _stream;
    video.style.transform = 'scaleX(-1)'; // mirror for natural feel
    await new Promise(res => video.onloadedmetadata = res);
    _offCanvas = document.createElement('canvas');
    _offCanvas.width = video.videoWidth;
    _offCanvas.height = video.videoHeight;
    _offCtx = _offCanvas.getContext('2d');
  } catch(e) {
    document.getElementById('booth-title').textContent = 'Camera unavailable';
  }
}

// ── STAGE ─────────────────────────────────────────────────────────────────────
function setStage(stage) {
  _stage = stage;
  document.querySelectorAll('.bottom-state').forEach(el => el.classList.remove('active'));
  document.getElementById('state-' + stage)?.classList.add('active');

  const video = document.getElementById('video');
  const canvas = document.getElementById('photo-canvas');
  const qrVf = document.getElementById('qr-vf');

  if (stage === 'ready') {
    video.style.display = 'block';
    canvas.style.display = 'none';
    qrVf.classList.remove('show');
    renderGuestChips();
    document.getElementById('take-photo-btn').disabled = _guests.length === 0;
  } else if (stage === 'qrscan') {
    qrVf.classList.add('show');
  } else if (stage === 'review') {
    video.style.display = 'none';
    canvas.style.display = 'block';
    qrVf.classList.remove('show');
  }
}

// ── GUEST MANAGEMENT ──────────────────────────────────────────────────────────
function renderGuestChips() {
  const row = document.getElementById('guests-row');
  if (!_guests.length) {
    row.innerHTML = '<span class="no-guests-label">Scan guests to include in this photo</span>';
    return;
  }
  row.innerHTML = _guests.map((g, i) => {
    const initials = ((g.first_name||'')[0]||'') + ((g.last_name||'')[0]||'');
    return `<div class="guest-chip">
      <div class="guest-chip-avatar">${initials}</div>
      <div class="guest-chip-name">${g.first_name}</div>
      <button class="guest-chip-remove" onclick="removeGuest(${i})">✕</button>
    </div>`;
  }).join('');
  document.getElementById('take-photo-btn').disabled = false;
}

function removeGuest(i) {
  _guests.splice(i, 1);
  renderGuestChips();
  if (_guests.length === 0) document.getElementById('take-photo-btn').disabled = true;
}

// ── QR SCAN FOR GUESTS ────────────────────────────────────────────────────────
function startGuestScan() {
  setStage('qrscan');
  _qrScanning = true;
  qrLoop();
}

function cancelGuestScan() {
  stopQR();
  setStage('ready');
}

function stopQR() {
  _qrScanning = false;
  if (_qrAnimFrame) { cancelAnimationFrame(_qrAnimFrame); _qrAnimFrame = null; }
}

function qrLoop() {
  if (!_qrScanning) return;
  const video = document.getElementById('video');
  if (video.readyState >= 2 && video.videoWidth > 0 && _offCanvas) {
    _offCtx.drawImage(video, 0, 0, _offCanvas.width, _offCanvas.height);
    const img = _offCtx.getImageData(0, 0, _offCanvas.width, _offCanvas.height);
    const code = jsQR(img.data, img.width, img.height, { inversionAttempts:'dontInvert' });
    if (code) { _qrScanning = false; handleGuestQR(code.data); return; }
  }
  _qrAnimFrame = requestAnimationFrame(qrLoop);
}

async function handleGuestQR(raw) {
  const parsed = parseQR(raw);
  if (!parsed) {
    flash('reject');
    setTimeout(() => { _qrScanning = true; qrLoop(); }, 1500);
    return;
  }
  try {
    const res = await fetch('/api/app-user?token=' + encodeURIComponent(parsed.token));
    if (!res.ok) throw new Error();
    const g = await res.json();
    // Don't add duplicates
    if (_guests.find(x => x.id === g.id)) {
      flash('reject');
      setTimeout(() => { _qrScanning = true; qrLoop(); }, 1200);
      return;
    }
    _guests.push(g);
    flash('accept');
    renderGuestChips();
    // Brief pause then continue scanning (for multi-person)
    setTimeout(() => { _qrScanning = true; qrLoop(); }, 800);
  } catch(e) {
    flash('reject');
    setTimeout(() => { _qrScanning = true; qrLoop(); }, 1500);
  }
}

function parseQR(raw) {
  if (!raw) return null;
  const s = raw.trim();
  if (/^[A-Z]{3}-/.test(s)) return { token: s.slice(4) };
  try { const t = new URL(s).searchParams.get('token'); if (t) return { token: t }; } catch(e){}
  if (/^[0-9a-f-]{32,}$/i.test(s)) return { token: s };
  return null;
}

// ── COUNTDOWN + CAPTURE ───────────────────────────────────────────────────────
async function startCountdown() {
  stopQR();
  document.getElementById('take-photo-btn').disabled = true;
  document.getElementById('scan-guest-btn')?.setAttribute('disabled','true');

  const display = document.getElementById('countdown-display');
  display.classList.add('show');

  for (let i = _countdownSecs; i > 0; i--) {
    display.innerHTML = `<div class="countdown-number">${i}</div>`;
    await sleep(900);
    display.innerHTML = '';
    await sleep(100);
  }
  display.innerHTML = '<div class="countdown-go">GO!</div>';
  await sleep(300);
  display.innerHTML = '';
  display.classList.remove('show');

  capturePhoto();
}

function capturePhoto() {
  // Camera flash
  const flashEl = document.getElementById('flash-el');
  flashEl.classList.add('flash');
  setTimeout(() => flashEl.classList.remove('flash'), 200);

  const video = document.getElementById('video');
  const canvas = document.getElementById('photo-canvas');
  const ctx = canvas.getContext('2d');

  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;

  // Draw video frame (un-mirror for actual photo)
  ctx.save();
  ctx.scale(-1, 1);
  ctx.drawImage(video, -canvas.width, 0, canvas.width, canvas.height);
  ctx.restore();

  // Draw overlay if selected
  if (_selectedOverlayDataUrl) {
    const overlayImg = new Image();
    overlayImg.onload = () => {
      ctx.drawImage(overlayImg, 0, 0, canvas.width, canvas.height);
      finishCapture(canvas);
    };
    overlayImg.src = _selectedOverlayDataUrl;
  } else {
    finishCapture(canvas);
  }
}

function finishCapture(canvas) {
  _capturedDataUrl = canvas.toDataURL('image/jpeg', 0.88);
  // Show in review
  document.getElementById('review-img').src = _capturedDataUrl;
  const names = _guests.map(g => g.first_name + ' ' + g.last_name).join(', ');
  document.getElementById('review-names').textContent = names || 'No guests scanned';
  document.getElementById('send-btn').disabled = _guests.length === 0;
  document.getElementById('take-photo-btn').disabled = false;
  setStage('review');
}

function retake() {
  _capturedDataUrl = null;
  setStage('ready');
}

// ── SEND ──────────────────────────────────────────────────────────────────────
async function sendPhotos() {
  if (!_capturedDataUrl || !_guests.length) return;
  const btn = document.getElementById('send-btn');
  btn.disabled = true;
  btn.textContent = 'Sending…';
  try {
    await fetch('/api/photos', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({
        imageData: _capturedDataUrl,
        guestIds: _guests.map(g => g.id),
        overlayId: _selectedOverlayId || null
      })
    });
    btn.textContent = '✓ Sent!';
    btn.style.background = '#007aff';
    await sleep(1200);
    // Reset for next group
    _guests = [];
    _capturedDataUrl = null;
    btn.textContent = 'Send to Guests ✓';
    btn.style.background = '';
    btn.disabled = false;
    setStage('ready');
  } catch(e) {
    btn.textContent = 'Failed — retry';
    btn.disabled = false;
  }
}

// ── UTILS ─────────────────────────────────────────────────────────────────────
function sleep(ms) { return new Promise(res => setTimeout(res, ms)); }

function flash(type) {
  const el = document.getElementById(type==='reject'?'reject-flash':'accept-flash');
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 280);
}
